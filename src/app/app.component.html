<div class="page">
  <button class="theme-toggle" (click)="toggleDarkMode()" type="button" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
    <!-- Sun icon (shown in dark mode, click to go light) -->
    <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Moon icon (shown in light mode, click to go dark) -->
    <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="layout">
    <div class="card">
      <h1 class="title">QRIS Amount Injector</h1>

      <div class="section">
       <div class="file-upload-row">

  <label class="file-btn" for="fileUpload">
    {{ selectedFile?.name || 'Choose file' }}
  </label>

  <button
    *ngIf="selectedFile"
    type="button"
    class="remove-file-btn"
    (click)="removeSelectedFile()"
    aria-label="Remove uploaded file"
    title="Remove file"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 6h18"></path>
      <path d="M8 6V4h8v2"></path>
      <path d="M19 6l-1 14H6L5 6"></path>
      <path d="M10 11v5"></path>
      <path d="M14 11v5"></path>
    </svg>
  </button>

</div>

<input
  id="fileUpload"
  type="file"
  (change)="onFileSelected($event)"
  accept="image/*"
  class="file-input-hidden"
>
      </div>

      <div class="section example-box">
        <p class="example-label">Contoh format upload QR nya kayak gini ya:</p>
        <img src="assets/images/contoh.png" alt="Contoh QRIS" class="example-img">
      </div>

      <div class="divider">
        <span>ATAU</span>
      </div>

      <div class="section">
        <label class="label">Paste QR text langsung</label>
        <textarea
          [(ngModel)]="rawQrText"
          rows="4"
          placeholder="00020101021126640018ID.CO.X.WWW..."
          class="textarea"
        ></textarea>
      </div>

      <div class="section">
        <label class="label">Nominal</label>
        <input type="text" [(ngModel)]="newAmount" placeholder="0" class="text-input">
      </div>

      <p class="hint">
        Kalau kamu isi keduanya, sistem otomatis pakai <strong>gambar dulu</strong>, baru fallback ke QR text kalau gambar kosong.
      </p>

      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <div class="button-row">
        <button (click)="generate()" class="btn btn-blue">Generate</button>
      </div>
    </div>

    <div class="result-card" [class.result-card-empty]="!generatedQrText">
      <ng-container *ngIf="generatedQrText; else emptyResult">
        <div class="qr-reveal" #qrReveal>
          <p class="result-label">QR hasil generate</p>
          <qrcode [qrdata]="generatedQrText" [width]="220" [errorCorrectionLevel]="'M'"></qrcode>

          <div class="raw-text-header">
            <p class="result-label">Raw text</p>
            <button (click)="copyToClipboard()" class="copy-btn" type="button">
              {{ copiedFeedback ? 'Copied!' : 'Copy' }}
            </button>
          </div>
          <textarea
            class="textarea result-textarea"
            readonly
            [value]="generatedQrText"
          ></textarea>
        </div>
      </ng-container>

      <ng-template #emptyResult>
        <p class="result-placeholder">Hasil QR akan muncul di sini</p>
      </ng-template>
    </div>
  </div>

  <div class="toast" [class.toast-visible]="showCopyToast">
  <span class="toast-icon">✓</span>
  <span>QR text berhasil di-copy!</span>
</div>
</div>
