<div class="page">
  <div class="layout">

    <!-- LEFT CARD -->
    <div class="card">

      <h1 class="title">
        QRIS Amount Injector
      </h1>

      <!-- FILE UPLOAD -->
      <div class="section">

        <div class="file-upload-row">

          <label
            class="file-btn"
            for="fileUpload"
          >
            {{ selectedFile?.name || 'Choose file' }}
          </label>

          <button
            *ngIf="selectedFile"
            type="button"
            class="remove-file-btn"
            (click)="removeSelectedFile()"
            aria-label="Remove uploaded file"
            title="Remove file"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5"></path>
              <path d="M14 11v5"></path>
            </svg>
          </button>

        </div>

        <input
          id="fileUpload"
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="file-input-hidden"
        >

      </div>


      <!-- EXAMPLE -->
      <div class="section example-box">

        <p class="example-label">
          Contoh format upload QR nya kayak gini ya:
        </p>

        <img
          src="assets/images/contoh.png"
          alt="Contoh QRIS"
          class="example-img"
        >

      </div>


      <!-- DIVIDER -->
      <div class="divider">
        <span>ATAU</span>
      </div>


      <!-- RAW QR TEXT -->
      <div class="section">

        <label class="label">
          Paste QR text langsung
        </label>

        <textarea
          [(ngModel)]="rawQrText"
          rows="4"
          placeholder="00020101021126640018ID.CO.X.WWW..."
          class="textarea"
        ></textarea>

      </div>


      <!-- AMOUNT -->
      <div class="section">

        <label class="label">
          Nominal
        </label>

        <input
          type="text"
          [(ngModel)]="newAmount"
          placeholder="0"
          class="text-input"
        >

      </div>


      <!-- HINT -->
      <p class="hint">
        Kalau kamu isi keduanya, sistem otomatis pakai
        <strong>gambar dulu</strong>,
        baru fallback ke QR text kalau gambar kosong.
      </p>


      <!-- GENERATE -->
      <div class="button-row">

        <button
          (click)="generate()"
          class="btn btn-blue"
        >
          Generate
        </button>

      </div>

    </div>


    <!-- RIGHT RESULT CARD -->
    <div
      class="result-card"
      [class.result-card-empty]="!generatedQrText"
    >

      <ng-container
        *ngIf="generatedQrText; else emptyResult"
      >

        <div
          class="qr-reveal"
          #qrReveal
        >

          <p class="result-label">
            QR hasil generate
          </p>


          <!-- QR CODE -->
          <qrcode
            [qrdata]="generatedQrText"
            [width]="220"
            [errorCorrectionLevel]="'M'"
          ></qrcode>


          <!-- RAW TEXT HEADER -->
          <div class="raw-text-header">

            <p class="result-label">
              Raw text
            </p>

            <button
              (click)="copyToClipboard()"
              class="copy-btn"
              type="button"
            >
              {{ copiedFeedback ? 'Copied!' : 'Copy' }}
            </button>

          </div>


          <!-- RAW TEXT -->
          <textarea
            class="textarea result-textarea"
            readonly
            [value]="generatedQrText"
          ></textarea>

        </div>

      </ng-container>


      <!-- EMPTY RESULT -->
      <ng-template #emptyResult>

        <p class="result-placeholder">
          Hasil QR akan muncul di sini
        </p>

      </ng-template>

    </div>

  </div>


  <!-- TOAST -->
  <div
    class="toast"
    [class.toast-visible]="showCopyToast"
    [class.toast-error]="toastType === 'error'"
  >

    <span class="toast-icon">
      {{ toastType === 'success' ? '✓' : '!' }}
    </span>

    <span>
      {{ toastMessage }}
    </span>

  </div>

</div>
